{% extends "layout.html" %}
{% block title %}
  <title>靓号管理</title>
{% endblock title %}

{% block content %}
 <div class="container">
    <div style="margin-bottom:5px;">
      <a href="/pretty/add/" class="btn btn-primary">
        <span class="glyphicon glyghicon-plus-sign" aria-hidden="true"></span>
        新增靓号
      </a>
    </div>  
      <div class="panel-default">
        <div class="panel-heading">
           <span class="glyphicon glyghicon-th-list" aria-hidden="true"></span>
           靓号列表
        </div>
        <div class="panel-body">
          <table class="table table-bordered table-responsive">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>手机号</th>
                  <th>价格</th>
                  <th>级别</th>
                  <th>状态</th>
                </tr>
              </thead>
              <tbody>
                {% for num in pretty_nums %}
                  <tr>
                    <td>{{num.id}}</td>
                    <td>{{num.mobile}}</td>
                    <td>{{num.price}}</td>
                    <td>{{num.get_level_display}}</td>
                    <td>{{num.get_status_display}}</td>
                    <td>
                      <a href="/pretty/{{num.id}}/edit/" class="btn btn-success btn-xs">编辑</a>
                      <a href="/pretty/{{num.id}}/del/" class="btn btn-danger btn-xs">删除</a>
                    </td>
                  </tr>
                {% endfor %}
              </tbody>
          </table>
        </div>
      </div>
 </div>
{% endblock content %}
