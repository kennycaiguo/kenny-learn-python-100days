{% extends "layout.html" %}
{% block title %}
  <title>新增用户</title>
{% endblock title %}

{% block content %}
  <div>
     <div class="panel-default">
        <div class="panel-heading">
            <h3 class="panel-title">新建用户</h3>
        </div>
        <div class="panel-body">
            {% comment %} <form action="/user/add/" method='post'>
                {% csrf_token %}
                <div class="form-group">
                    <label>姓名</label>
                    <div>
                        <input type="text" class='form-control' name="name" placeholder="输入姓名">
                    </div>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <div>
                        <input type="text" class='form-control' name="pwd" placeholder="输入密码">
                    </div>
                </div>
                <div class="form-group">
                    <label>年龄</label>
                    <div>
                        <input type="text" class='form-control' name="age" placeholder="年龄">
                    </div>
                </div>
                <div class="form-group">
                    <label>余额</label>
                    <div>
                        <input type="text" class='form-control' name="acc" placeholder="余额">
                    </div>
                </div>
                <div class="form-group">
                    <label>入职时间</label>
                    <div>
                        <input type="text" class='form-control' name="ctime" placeholder="入职时间">
                    </div>
                </div>
                <div class="form-group">
                    <label>性别</label>
                    <div>
                        <select name="gender" class='form-group'>
                            {% for g  in g_choice  %}
                              <option value="{{g.0}}">{{g.1}}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>部门</label>
                    <div>
                        <select name="dep" class='form-group'>
                            {% for dep  in deps  %}
                              <option value="{{dep.id}}">{{dep.title}}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                 <button type="submit" class="btn btn-success">保 存</button>
            </form> {% endcomment %}
            <form action="/user/add/" method="post">
                {% csrf_token %}
                {% for field in form %}
                   {{field.label}}: {{field}} <br>
                {% endfor %}
                <button type="submit" class="btn btn-success">保 存</button>
            </form>
        </div>
     </div>
  </div>
{% endblock content %}
