{% extends "layout.html" %}

{% block title %}
   <title>管理员列表</title>
{% endblock title %}

{% block content %}
   <div class="container">
      <div style="margin-bottom:5px;" class="clearfix">
        <a href="/admin/add/" class="btn btn-primary">
            <span class="glyphicon glyphicon-plus-sign" aria-hidden="true"></span>
            新增管理员
        </a>
        <div style="float:right;width: 300px;">
           <form method="get">
              <div class="input-group">
                <input type="text" name="kw" class="form-control" placeholder="关键字..." value="{{kw}}">
                <span class="input-group-btn">
                   <button class="btn btn-default" type="submit">
                       <span class="glyphicon glyphicon-search" aria-hidden="true"></span>
                   </button>
                </span>
              </div>
           </form>
        </div>
        <div class="panel-default">
            <div class="panel-heading">
                <span class="glyphicon glyphicon-th-list" aria-hidden="true"></span>
                管理员列表
            </div>
            <div class="panel-body">
                <table class="table table-bordered table-responsive">
                  <thead>
                    <tr>
                        <th>ID</th>
                        <th>用户名</th>
                        <th>密  码</th>
                        <th>操作</th>
                    </tr>
                  </thead>
                  <tbody>
                    {% for a in admins %}
                      <tr>
                        <td>{{a.id}}</td>
                        <td>{{a.username}}</td>
                        <td>*********</td>
                        <td>
                            <a href="/admin/{{a.id}}/edit/" class="btn btn-success btn-xs">编辑</a>
                            <a href="/admin/{{a.id}}/del/" class="btn btn-danger btn-xs">删除</a>
                        </td>
                      </tr>
                    {% endfor %}
                  </tbody>
                </table>
            </div>
        </div>
      </div>
      <div class="clearfix">
        <ul class="pagination">
            {{page_str}}
        </ul>
      </div>
   </div>

{% endblock content %}
